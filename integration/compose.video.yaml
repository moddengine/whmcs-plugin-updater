services:
  mock-github:
    build: mock-github
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/health"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks:
      default:
        ipv4_address: 172.24.0.4
        aliases:
          - api.github.com
    volumes:
      - mock-certs:/certs

  web:
    depends_on:
      mock-github:
        condition: service_healthy
    volumes:
      - mock-certs:/mock-certs:ro

  playwright:
    build: playwright
    depends_on:
      web:
        condition: service_started
    environment:
      BASE_URL: http://localhost
      WHMCS_VERSION: ${WHMCS_ARTIFACT_TAG:-8137}
    ipc: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./artifacts:/artifacts

volumes:
  mock-certs:
